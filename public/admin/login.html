<!doctype html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Administration | SJSTCM</title>
<link
    rel="icon"
    type="image/png"
    href="assets/images/favicon.png"
  >
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-login-body">

  <main class="auth-page">

    <form
      class="auth-card"
      id="login-form"
      method="post"
      action="api/auth/login"
    >

      <a class="admin-login-brand" href="index.html" aria-label="St. Joseph's Science and Technical College home">
        <img src="assets/images/logo.png" alt="St. Joseph's Science and Technical College logo" />
      </a>

      <span class="eyebrow">ADMINISTRATION</span>

      <h1>Staff / Admin Login</h1>

      <input
        type="email"
        name="email"
        placeholder="Email"
        autocomplete="email"
        required
      >

      <div class="password-field">
        <input
          id="login-password"
          type="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >
        <button
          type="button"
          id="toggle-password"
          class="password-toggle"
          aria-label="Show password"
          aria-controls="login-password"
          aria-pressed="false"
        >
          <i class="bx bx-show" aria-hidden="true"></i>
        </button>
      </div>

      <button
        type="submit"
        class="button"
      >
        Sign in
      </button>

      <p id="login-status" role="status" aria-live="polite"></p>

      <a href="index.html">
        ← Back to website
      </a>

    </form>

  </main>

  <script src="js/portal.js"></script>

</body>
</html>
